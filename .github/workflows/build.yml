name: build

on:
  push:
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a GitHub release with this tag (e.g. v0.1.0). Leave empty to just build."
        required: false
        default: ""

jobs:
  firmware:
    name: SP-1 firmware (sp1verb.bin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: sp-1verb

      - name: Cache the Zephyr SDK and tree
        id: zcache
        uses: actions/cache@v4
        with:
          path: |
            ~/zephyr-sdk-0.17.4
            ws
          key: zephyr-4.3.1-sdk-0.17.4-nordic

      - name: Zephyr SDK 0.17.4 (arm only)
        if: steps.zcache.outputs.cache-hit != 'true'
        run: |
          cd $HOME
          curl -sSL -o sdk.tar.xz https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v0.17.4/zephyr-sdk-0.17.4_linux-x86_64_minimal.tar.xz
          tar xf sdk.tar.xz && rm sdk.tar.xz
          curl -sSL -o arm.tar.xz https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v0.17.4/toolchain_linux-x86_64_arm-zephyr-eabi.tar.xz
          tar xf arm.tar.xz -C zephyr-sdk-0.17.4 && rm arm.tar.xz

      - name: Zephyr v4.3.1 (hal_nordic, cmsis)
        if: steps.zcache.outputs.cache-hit != 'true'
        run: |
          pip install west
          git clone --depth 1 --branch v4.3.1 https://github.com/zephyrproject-rtos/zephyr ws/zephyr
          cd ws && west init -l zephyr
          west config manifest.project-filter -- '-.*,+hal_nordic,+cmsis_6,+cmsis'
          west update --narrow -o=--depth=1

      - name: Build
        run: |
          pip install west -r ws/zephyr/scripts/requirements-base.txt
          export ZEPHYR_SDK_INSTALL_DIR=$HOME/zephyr-sdk-0.17.4 ZEPHYR_BASE=$GITHUB_WORKSPACE/ws/zephyr
          cd ws && ../sp-1verb/scripts/build-firmware.sh

      - name: Check the binary
        run: |
          # flashable by the SP-1 bootloader: loaded at 0x20000, at most 0xDF000 bytes, the vector
          # table first (initial stack in RAM, reset handler inside the image)
          python3 - sp-1verb/sp1verb.bin <<'PY'
          import struct, sys
          b = open(sys.argv[1], "rb").read()
          sp, reset = struct.unpack("<II", b[:8])
          print(f"size {len(b)}, initial SP {sp:#x}, reset {reset:#x}")
          assert 0 < len(b) <= 0xDF000, "too big for the application slot"
          assert 0x20000000 < sp <= 0x20040000, "initial stack pointer is not in RAM"
          assert reset & 1 and 0x20000 <= (reset & ~1) < 0x20000 + len(b), "reset handler outside the image"
          PY
          # and it fits: RAM used, from the build
          grep -q "CONFIG_BOARD_STEM_PLAYER=y" sp-1verb/build/firmware/zephyr/.config

      - name: CPU estimate (Cortex-M4 at 48 kHz, every model, everything on)
        run: |
          pip install unicorn capstone
          # one core is 100%; keep every model's worst case clear of it
          for m in 0 1 2 3 4 5 6 7; do
            BENCH_MODEL=$m ZEPHYR_SDK_INSTALL_DIR=$HOME/zephyr-sdk-0.17.4 python3 sp-1verb/tools/bench_m4.py | tee bench.txt
            pct=$(sed -n 's/.*: \([0-9]*\)% of one core.*/\1/p' bench.txt)
            echo "model $m worst case: $pct% of one core"
            test -n "$pct" && test "$pct" -le 80
          done
          # and a switch that keeps the tail, while its lengths crossfade (or SHIMMER's octave fades)
          for sw in "0 1" "2 0" "4 5" "5 4"; do
            set -- $sw
            BENCH_MODEL=$1 BENCH_SWITCH=$2 ZEPHYR_SDK_INSTALL_DIR=$HOME/zephyr-sdk-0.17.4 python3 sp-1verb/tools/bench_m4.py | tee bench.txt
            pct=$(sed -n 's/.*: \([0-9]*\)% of one core.*/\1/p' bench.txt)
            echo "switch $1 to $2: $pct% of one core"
            test -n "$pct" && test "$pct" -le 80
          done

      - uses: actions/upload-artifact@v4
        with:
          name: sp1verb-firmware
          path: sp-1verb/sp1verb.bin

  test:
    name: Effects engine tests (host)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The README shows the source's version
        run: |
          # README's "Latest release" line and FIRMWARE_VERSION in src/firmwareVersion.ts move together
          v=$(sed -n "s/.*FIRMWARE_VERSION = 'v\\([^']*\\)'.*/\\1/p" src/firmwareVersion.ts)
          grep -qF "**Latest release:** [v$v](../../releases/tag/v$v)" README.md ||
            { echo "::error::README.md's Latest release line isn't v$v, FIRMWARE_VERSION in src/firmwareVersion.ts"; exit 1; }

      - name: Build and run the checks
        run: |
          mkdir -p build/test
          make test | tee build/test/results.txt

      - name: Check the results
        run: |
          r=build/test/results.txt
          grep -q "^PASS: 0 failed" $r
          # the sound's promises
          grep -q "^dry: bit-exact input at the stated latency .* ok" $r
          grep -q "^dry: an 18 kHz tone passes (full bandwidth) .* ok" $r
          for m in HALL PLATE ROOM SPRING CLOUD SHIMMER GATED REVERSE; do
            grep -q "^$m: blocks of 256 and of 1..300, same output .* ok" $r
            grep -q "^$m: decay full, hot input: peak under -0.3 dBFS .* ok" $r
            grep -q "^$m: sweep every control: no clicks .* ok" $r
          done
          grep -q "^SPRING: smooth tail, no echo train .* ok" $r
          grep -q "^SPRING: 400 Hz arrives after 3 kHz in a trip, the drip .* ok" $r
          grep -q "^SPRING: a hard hit crashes.* ok" $r
          grep -q "^models: switching every 0.5 s while playing: no clicks .* ok" $r
          grep -q "^models: a switch between tank models keeps the tail .* ok" $r
          grep -q "^models: and it does not click .* ok" $r
          grep -q "^SHIMMER: DECAY at the top, the tail still dies away .* ok" $r
          grep -q "^filter: flat anywhere in the middle fifth .* ok" $r

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-output
          path: build/test/

  release:
    name: Publish release
    # runs for: a pushed v* tag, a release created on the website, or a manual run with a tag filled in
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release' || inputs.release_tag != ''
    needs: [firmware, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: sp1verb-firmware

      - name: Create GitHub release with sp1verb.bin
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.event.release.tag_name || github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" sp1verb.bin --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" sp1verb.bin \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "SP-1 Reverb $TAG" \
              --notes-file .github/release-notes.md \
              --prerelease
          fi
